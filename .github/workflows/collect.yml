name: Collect new records

# Daily at 06:17 Bangladesh time (00:17 UTC), or by hand from the Actions tab.
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: Maximum new records this run
        default: '20'
      dry_run:
        description: Collect and report only; do not save or publish
        type: boolean
        default: false

permissions:
  contents: write   # commit the new snapshot file
  models: read      # GitHub Models, used only when no GEMINI_API_KEY secret is set
  actions: write    # start the Pages deploy (pushes made by this workflow do not trigger it)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix collector --ignore-scripts --no-audit --no-fund
      - id: collect
        run: node collector/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_RECORDS: ${{ inputs.max_records || '20' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      # The same checks and build the Pages workflow runs, so a bad file never reaches main.
      - run: node scripts/check.mjs && node scripts/build-pages.mjs
      - name: Commit and publish
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add snapshots
          if git diff --cached --quiet; then echo "Nothing new to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-collect: ${{ steps.collect.outputs.added }} new records"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
